<!DOCTYPE html>
<html lang="vi" data-pub="1"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nguyễn Hoàng Quân</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700;800&amp;family=Playfair+Display:wght@700;800&amp;display=swap" rel="stylesheet">
<style>
:root{--bg:#F7F8FA;--surface:#FFFFFF;--ink:#0E1116;--muted:#5A6473;--line:#DDE1E8;--accent:#4B2FE0;--on:#FFFFFF;--tint:#ECEAFD;--hl:#C6FF4D;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:80px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.7;overflow-x:hidden}
body.edit{padding-bottom:150px}
a{color:inherit}ul{margin:0;padding:0;list-style:none}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}
#pg{position:fixed;top:0;left:0;height:3px;width:0;background:var(--accent);z-index:50}
header{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);color:var(--ink);border-bottom:1px solid var(--line)}
.bar{max-width:1240px;margin:0 auto;padding:6px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;min-height:56px}
.brand{font-family:"Playfair Display",Georgia,serif;font-weight:700;text-decoration:none;font-size:1.05rem;margin-right:auto;letter-spacing:.02em}
.nav>ul{display:flex;gap:2px}.nav li{position:relative}
.nav a{display:block;padding:10px 14px;color:var(--ink);text-decoration:none;text-transform:uppercase;font-size:.78rem;letter-spacing:.08em;font-weight:500;border-bottom:2px solid transparent;white-space:nowrap}
.nav a:hover{background:var(--tint)}.nav a.on{border-bottom-color:var(--accent);color:var(--accent)}
.nav li>ul{display:none;position:absolute;right:0;top:100%;min-width:230px;background:var(--surface);border:1px solid var(--line);padding:6px;border-radius:0 0 12px 12px;z-index:5}
.nav li>ul a{text-transform:none;letter-spacing:0;font-size:.95rem;border:0;border-radius:8px}
.nav li:hover>ul,.nav li:focus-within>ul{display:block}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
.hero{position:relative;min-height:calc(100vh - 60px);min-height:calc(100svh - 60px);display:grid;place-items:center;text-align:center;color:#fff;background:linear-gradient(rgba(0,0,0,.35),rgba(0,0,0,.6)),repeating-linear-gradient(90deg,#6b4a34 0 140px,#4f3524 140px 143px,#72523b 143px 310px,#4a3121 310px 313px);background-size:cover;background-position:center}
.hin{padding:40px 20px}
.hero h1{font-family:"Playfair Display",Georgia,serif;font-size:calc(clamp(2rem,6vw,4rem)*var(--hs,1));line-height:1.1;font-weight:800;margin:0 0 16px;text-shadow:0 2px 14px rgba(0,0,0,.5)}
.hero p{font-family:"Playfair Display",Georgia,serif;font-size:calc(clamp(.9rem,1.8vw,1.15rem)*var(--hs,1));margin:0 auto;max-width:60ch;opacity:.92}
.down{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);background:none;border:0;color:#fff;font-size:2.4rem;cursor:pointer;animation:bob 1.8s ease-in-out infinite}
@keyframes bob{50%{transform:translate(-50%,8px)}}
.phead{position:relative;overflow:hidden;border-bottom:1px solid var(--line)}
.phead::before{content:"";position:absolute;top:-60%;right:-10%;width:50vw;height:50vw;background:radial-gradient(closest-side,color-mix(in srgb,var(--accent) 22%,transparent),transparent);pointer-events:none}
.phead .wrap{position:relative;padding-top:56px;padding-bottom:44px}
.phead h1{font-family:"Playfair Display",Georgia,serif;font-size:calc(clamp(2rem,6vw,3.8rem)*var(--hs,1));line-height:1.1;font-weight:800;margin:0}
.crumb{margin:0 0 10px;color:var(--muted);font-size:.9rem}.crumb a{color:var(--accent);text-decoration:none}
.sec{padding:56px 0 24px}.sec .wrap{max-width:980px}
.rv h2{font-size:calc(clamp(1.5rem,3.5vw,2.1rem)*var(--s,1));font-weight:800;line-height:1.2;margin:36px 0 12px}
.rv h3{font-size:calc(1.3rem*var(--s,1));margin:24px 0 8px}
.rv p{font-size:calc(1.06rem*var(--s,1));margin:0 0 16px;max-width:72ch}
.rv li{font-size:calc(1.05rem*var(--s,1))}
ul.list{padding-left:22px;list-style:disc;margin-bottom:16px}
figure{margin:20px auto}figure img{width:100%;border-radius:14px;display:block}.iw{position:relative}
.ph{width:100%;aspect-ratio:16/9;background:var(--tint);border:2px dashed var(--line);border-radius:14px;display:grid;place-items:center;color:var(--muted);text-align:center;padding:12px;font-size:.9rem}
figcaption{margin-top:6px;color:var(--muted);font-size:.9rem;text-align:center}
.btn{display:inline-block;padding:12px 24px;border-radius:12px;background:var(--accent);color:var(--on);font-weight:700;text-decoration:none}
.media{display:flex;gap:28px;align-items:flex-start;flex-wrap:wrap;margin:24px 0;padding:20px 0;border-top:1px solid var(--line)}
.m-img{position:relative;flex:none;max-width:100%}.m-img img,.m-img .ph{width:100%;display:block;border-radius:12px}.m-img .ph{aspect-ratio:3/4}
.m-t{flex:1;min-width:240px}.m-t h3{margin-top:0}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--gs,220px),1fr));gap:16px;margin:20px 0}
.gi{margin:0}.giw{position:relative}
.giw img{width:100%;aspect-ratio:4/3;object-fit:contain;background:var(--tint);border-radius:10px;display:block}.gal .ph{aspect-ratio:4/3}
.proj{display:grid;grid-template-columns:1.15fr 1fr;gap:28px;align-items:center;padding:20px;margin:22px 0;background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:0 8px 28px rgba(0,0,0,.08)}
.proj .slider{order:-1}.proj.alt{grid-template-columns:1fr 1.15fr}.proj.alt .slider{order:1}
.rv h2.sh{font-size:calc(clamp(1.8rem,4.5vw,2.6rem)*var(--s,1));margin:72px 0 18px;padding-top:26px;border-top:3px solid var(--accent)}
.slider.wide{margin:20px 0}
.pj-t h3{margin-top:0}
.slider{position:relative;overflow:hidden;border-radius:16px;background:var(--tint)}
.track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}.track::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:center;position:relative}
.slide img{width:100%;height:var(--gs,280px);object-fit:cover;display:block}
.slider>.ph{height:var(--gs,280px);aspect-ratio:auto;border-radius:16px}
.sa{position:absolute;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:1.4rem;cursor:pointer;line-height:1}
.sa.l{left:10px}.sa.r{right:10px}
.x{position:absolute;top:6px;right:6px;z-index:2;border:0;border-radius:50%;width:26px;height:26px;background:rgba(0,0,0,.7);color:#fff;cursor:pointer}
.profile{padding:28px;border-radius:24px;background:linear-gradient(135deg,var(--tint),var(--surface));border:1px solid var(--line)}
.pf-top{display:flex;gap:32px;align-items:center;flex-wrap:wrap}
.pf-photo{position:relative;flex:none;max-width:100%}
.pf-photo img,.pf-photo .ph{width:100%;aspect-ratio:1;border-radius:50%;object-fit:cover;border:3px solid var(--ink);display:block}
.pf-i{flex:1;min-width:260px}
.pf-i h2{margin:0 0 12px;font-size:calc(clamp(1.8rem,4vw,2.6rem)*var(--s,1))}
.pf-i li{font-size:calc(1.05rem*var(--s,1));padding:2px 0}.pf-i a{color:var(--accent)}
.profile blockquote{margin:24px 0;padding:18px 22px;border:2px solid var(--ink);border-radius:20px;font-style:italic;background:var(--surface);font-size:calc(1.1rem*var(--s,1))}
.pf-pill{display:inline-block;border:2px solid var(--ink);border-radius:999px;padding:6px 22px;font-size:calc(1.1rem*var(--s,1));font-weight:500}
.cgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:24px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:18px;padding:28px;margin:16px 0}
.contact li{padding:10px 0;border-bottom:1px solid var(--line);font-size:calc(1.05rem*var(--s,1))}
.contact .lb{margin-right:8px}.contact a{color:var(--accent);font-weight:700;word-break:break-word}
.map{width:100%;min-height:260px;height:100%;border:0;border-radius:12px;background:var(--tint)}
.cvf{display:block;width:100%;max-width:880px;margin:0 auto;height:auto;aspect-ratio:210/297;min-height:60vh;border:1px solid var(--line);border-radius:12px;background:#fff}.cvi{max-width:100%;border-radius:12px}
footer{margin-top:72px;padding:26px 20px;border-top:1px solid var(--line);text-align:center;color:var(--muted);font-size:.9rem}
.rv{opacity:0;transform:translateY(28px);transition:opacity .7s ease,transform .8s cubic-bezier(.2,.7,.2,1);transition-delay:var(--d,0ms)}
.rv.in,body.edit .rv{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.rv{opacity:1;transform:none;transition:none}.down{animation:none}html{scroll-behavior:auto}}

/* Chế độ chỉnh sửa */
.rv p,.rv h2,.rv h3,.rv li,.rv figcaption,.rv blockquote,.pf-pill span,.contact span,.hero h1,.hero p,.phead h1{white-space:pre-wrap}
[contenteditable]{outline:1px dashed var(--accent);outline-offset:3px;min-width:2ch;min-height:1em;cursor:text}
[contenteditable]:focus{outline:2px solid var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
[data-pick],[data-pickcv]{cursor:pointer}
.blk{position:relative;border-left:3px solid transparent;padding-left:10px;margin-left:-13px}
.blk:hover,.blk:focus-within{border-left-color:var(--accent)}
.blk.dragging{z-index:5;outline:2px solid var(--accent);background:var(--tint)}
.mv{position:relative;z-index:1}
.ctl,.sctl{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;margin:8px 0 -2px}
.sctl{justify-content:flex-start;margin:0 0 24px}
.ctl button,.sctl button,.sctl select,.mini{font:inherit;font-size:.78rem;padding:2px 9px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.grip{margin-right:auto;font-size:.78rem;padding:2px 10px;border-radius:6px;border:1px solid var(--accent);background:var(--tint);color:var(--ink);cursor:grab;user-select:none;touch-action:none}
.rsz{position:absolute;right:-10px;bottom:-10px;width:22px;height:22px;border-radius:50%;background:var(--accent);border:3px solid var(--bg);cursor:nwse-resize;touch-action:none;z-index:3}
#tb{display:none;position:fixed;left:0;right:0;bottom:0;z-index:60;background:#0E1116;color:#fff;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));flex-wrap:wrap;gap:8px;align-items:center;box-shadow:0 -6px 24px rgba(0,0,0,.3)}
body.edit #tb{display:flex}
#tb button{font:inherit;font-size:.85rem;padding:7px 12px;border-radius:8px;border:1px solid rgba(255,255,255,.4);background:transparent;color:#fff;cursor:pointer}
#tb .pri{background:#C6FF4D;color:#0E1116;font-weight:700;border-color:#C6FF4D}
@media (max-width:900px){
  .nav{order:3;width:100%;overflow-x:auto;scrollbar-width:none}
  .nav>ul{width:max-content}.nav li{display:flex}
  .nav li>ul{display:flex;position:static;padding:0;background:none}
  .proj,.proj.alt{grid-template-columns:1fr}
  .mv,.blk{transform:none!important}
}
</style>
</head>

 cơ khí phục vụ các hệ thống tự động hóa và mô hình thực nghiệm: dựng mô hình 3D, lập bản vẽ chế tạo và bản vẽ lắp, chú thích dung sai và lắp ghép theo tiêu chuẩn. Khi thiết kế, tôi chú trọng chọn vật liệu, tính toán độ bền và lựa chọn cơ cấu g sao cho phù hợp với tải trọng và không gian lắp đặt. Tôi cũng phối hợp thiết kế cơ khí với phần điện và điều khiển để sản phẩm dễ gia công, lắp ráp và bảo trì và tôi cũng đạt được chứng chỉ SolidWorks Professional. Trong tương lai tôi sẽ cố gắng nổ lực đạt được chứng chỉ Certified SOLIDWORKS Expert","al":"justify"},{"t":"gallery","items":[{"src":"media/m1.jpg","cap":""},{"src":"media/m2.jpg","cap":""},{"src":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/4gHYSUNDX1BST0ZJTEUAAQEAAAHIAAAAAAQwAABtbnRyUkdCIFhZWiAH4AABAAEAAAAAAABhY3NwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAQAA9tYAAQAAAADTLQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAlkZXNjAAAA8AAAACRyWFlaAAABFAAAABRnWFlaAAABKAAAABRiWFlaAAABPAAAABR3dHB0AAABUAAAABRyVFJDAAABZAAAAChnVFJDAAABZAAAAChiVFJDAAABZAAAAChjcHJ0AAABjAAAADxtbHVjAAAAAAAAAAEAAAAMZW5VUwAAAAgAAAAcAHMAUgBHAEJYWVogAAAAAAAAb6IAADj1AAADkFhZWiAAAAAAAABimQAAt4UAABjaWFlaIAAAAAAAACSgAAAPhAAAts9YWVogAAAAAAAA9tYAAQAAAADTLXBhcmEAAAAAAAQAAAACZmYAAPKnAAANWQAAE9AAAApbAAAAAAAAAABtbHVjAAAAAAAAAAEAAAAMZW5VUwAAACAAAAAcAEcAbwBvAGcAbABlACAASQBuAGMALgAgADIAMAAxADb/2wBDAAYEBAUEBAYFBQUGBgYHCQ4JCQgICRINDQoOFRIWFhUSFBQXGiEcFxgfGRQUHScdHyIjJSUlFhwpLCgkKyEkJST/2wBDAQYGBgkICREJCREkGBQYJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCT/wAARCAFTASIDASIAAhEBAxEB/8QAHQAAAgEFAQEAAAAAAAAAAAAAAAECAwUGBwgECf/EAFkQAAEDAgMDBAkPBwgJBQEAAAEAAgMEEQUGEgchMQgTQVEiUmFxgZGhsdIUFhcyMzRVVmJydJKzwdEVI1Nzk5SyJCc2N0J1wuEYQ4Kio6TT4vAmNVSD8WP/xAAaAQEAAgMBAAAAAAAAAAAAAAAAAQIDBAUG/8QAMxEAAgECAwMMAgICAwAAAAAAAAECAxEEEjEFIVETFBUyM0FSYYGRofBxwSKxI/FC0eH/2gAMAwEAAhEDEQA/AOqUIKV0A0JXRdANCV0XQDQldF0A0JXRdANCV0XQDQldF0A0JXRdANCV0XQDQldF0A0JEpXKAkhR1FLUetATQoF560i89aAqIVIyO60jI7rSwKyF5zM/r8iRmf23kU2Fz0oXkNRJ23kUTUy9t5AliLntQvCaqXt/IFE "text":"GIẢI THƯỞNG"},{"t":"h3","text":"THÀNH TÍCH"},{"t":"p","text":"Hành trình hai năm đầu đại học thử thách tôi qua từng kỳ thi căng thẳng, đòi hỏi sự bền bỉ không ngừng để duy trì thành tích tốt. Trước những áp lực đôi khi khiến bản thân chông chênh, nguồn động lực thôi thúc tôi tiến về phía trước bắt nguồn từ gia đình, đặc biệt là mẹ. Sự cần cù, mộc mạc và ý chí kiên cường của một người phụ nữ làm nông đã hun đúc trong tôi thái độ sống trách nhiệm và không ngại gian khổ. Từng nỗ lực trong học tập của tôi không chỉ vì hoài bão cá nhân, mà còn để hiện thực hóa niềm tin và những hy sinh mà mẹ đã gửi gắm. Vượt qua những giới hạn của bản thân là cách tôi bày tỏ lòng biết ơn sâu sắc nhất tới mẹ, đồng thời đánh dấu sự trưởng thành về cả năng lực lẫn ý chí trên con đường học tập và phát triển sự nghiệp sau này.","al":"justify"},{"t":"gallery","items":[{"src":"media/m7.jpg","cap":"Bằng khen sinh viên Khá"},{"src":"media/m8.jpg","cap":"Bằng khen sinh viên Giỏi"}],"gs":310},{"t":"p","text":"Đồng hành cùng đội tuyển LH-AUTX tranh tài tại cuộc thi thiết kế máy tự động hóa Misumi, xuất sắc hoàn thiện đề án máy tự động hóa công nghiệp đáp ứng các tiêu chuẩn khắt khe về tính khả thi chế tạo và tính toán cơ cấu. Đảm nhiệm vai trò then chốt trong việc tính toán động lực học, thiết kế mô hình 3D, chuẩn hóa hồ sơ kỹ thuật và hoàn thiện bộ tài liệu nhận diện đồ họa cho dự án, góp phần đưa sản phẩm của đội vào nhóm đề án xuất sắc được hội đồng chuyên môn đánh giá cao.","al":"justify"},{"t":"slider","items":[{"src":"media/m9.jpg","cap":""},{"src":"media/m10.jpg","cap":""},{"src":"media/m11.jpg","cap":""}],"gs":420},{"t":"sec","text":"KỸ NĂNG"},{"t":"media","title":"KỸ NĂNG LÀM VIỆC NHÓM","text":"Tôi coi trọng sự phối hợp và tôn trọng ý kiến của từng thành viên. Khi làm việc nhóm, tôi chủ động phân chia nhiệm vụ rõ ràng, báo cáo tiến độ thường xuyên và sẵn sàng hỗ trợ đồng đội khi gặp khó khăn để cả nhóm cùng hoàn thành mục tiêu.","items":[{"src":"media/m12.jpg","cap":""},{"src":"media/m13.jpg","cap":""},{"src":"media/m14.jpg","cap":""},{"src":"media/m15.jpg","cap":""},{"src":"media/m16.jpg","cap":""},{"src":"media/m17.jpg","cap":""}],"gs":380,"al":"justify"},{"t":"media","title":"KỸ NĂNG AN TOÀN","text":"Nắm vững và tuân thủ nghiêm ngặt các quy chuẩn an toàn lao động trong môi trường kỹ thuật tự động hóa và cơ điện tử. Thành thạo quy trình khóa cách ly nguồn năng lượng nguy hiểm , đánh giá rủi ro trước vận hành và thiết kế hệ thống có tích hợp các cơ cấu dừng khẩn cấp ,  Luôn đặt tiêu chuẩn an toàn con người và độ bền thiết bị lên hàng đầu trong cả khâu thiết kế cơ điện lẫn quá trình chạy thử nghiệm thực tế","items":[{"src":"media/m18.jpg","cap":""}],"gs":350,"al":"justify"},{"t":"media","title":"KỸ NĂNG 3S – 5S","text":"3S – 5S là phương pháp tổ chức nơi làm việc gồm Sàng lọc, Sắp xếp, Sạch sẽ (3S), cùng với Săn sóc và Sẵn sàng (đủ 5S). Tôi áp dụng tinh thần này để giữ bàn làm việc, dụng cụ và tài liệu gọn gàng, dễ tìm và an toàn, từ đó làm việc nhanh và hiệu quả hơn.","items":[{"src":"media/m19.jpg","cap":""}],"gs":380,"al":"justify"},{"t":"sec","text":"HOẠT ĐỘNG NGOẠI KHÓA"},{"t":"media","title":"Tham Quan Triển Lãm Khoa Học & Trải Nghiệm Doanh Nghiệp","text":"Tham gia các đợt tham quan thực tế tại triển lãm công nghệ và doanh nghiệp sản xuất tự động hóa nhằm kết nối lý thuyết trên giảng đường với thực tiễn công nghiệp. Hoạt động mang lại góc nhìn đa chiều về các giải pháp cơ điện tử hiện đại, dây chuyền sản xuất thông minh và quy trình quản trị kỹ thuật số trong nhà máy thực tế. Đây là cơ hội quý giá để cập nhật xu hướng công nghệ mới, mở rộng tư duy thiết kế hệ thống và định hình rõ nét lộ trình phát triển nghề nghiệp.","items":[{"src":"media/m20.jpg","cap":""},{"src":"media/m21.jpg","cap":""},{"src":"media/m22.jpg","cap":""},{"src":"media/m23.jpg","cap":""}],"al":"justify"},{"t":"media","items":[{"src":"media/m24.jpg","cap":""}],"title":"Hiến máu thiện nguyện","text":"Tích cực hưởng ứng và trực tiếp tham gia các phong trào hiến máu nhân đạo do nhà trường và các tổ chức y tế phát động. Hoạt động thể hiện tinh thần tương thân tương ái, ý thức trách nhiệm xã hội và mong muốn đóng góp giọt máu cứu người, chung tay khắc phục tình trạng khan hiếm nguồn máu điều trị cho bệnh nhân.","al":"justify"}]},{"id":"du-an","label":"Dự án","title":"Dự án","blocks":[{"t":"project","title":"Thiết kế máy tự động hóa","text":"\u003cb>Bài toán:\u003c/b> Thiết kế trạm gắp - đặt linh kiện tốc độ cao kết hợp cơ cấu cấp khay (tray) liên tục, tối ưu không gian lắp đặt và giảm thời gian dừng máy.   \n\u003cb>Vai trò & Giải pháp:\u003c/b> Thành viên thiết kế chính  trực tiếp dựng mô hình 3D trên SOLIDWORKS, lựa chọn linh kiện tiêu chuẩn MISUMI, thiết kế cụm giác hút chân không khí nén và tính toán hành trình.   \n\u003cb>Kết quả:\u003c/b> Hoàn thiện bộ hồ sơ kỹ thuật, bản vẽ lắp 3D và video mô phỏng nguyên lý; xuất sắc đạt Giải Khuyến Khích Toàn Miền Nam.","items":[{"src":"media/m25.webp","cap":""}],"gs":280,"al":"justify"},{"t":"project","title":"Thiết kế mô phỏng cánh tay Robot công nghiệp xếp hàng lên pallet","text":"\u003cb>Bài toán:\u003c/b> Tự động hóa công đoạn bốc dỡ và xếp thùng carton từ băng chuyền sang pallet theo ma trận nhiều lớp, giải quyết triệt để điểm nghẽn đóng gói và hạn chế sai sót khi thao tác thủ công.   \n\u003cb>Vai trò & Giải pháp:\u003c/b> Thiết kế bố trí không gian trạm làm việc ; giải bài toán động học thuận/nghịch loại bỏ điểm kỳ dị; lập trình thuật toán ma trận xếp hàng đa tầng linh hoạt kết hợp hoạch định quỹ đạo nội suy tránh va chạm .   \n\u003cb>Kết quả:\u003c/b> Mô phỏng thành công chu trình Pick & Place khép kín với giác hút chân không; robot vận hành mượt mà, tối ưu hóa chu kỳ xếp hàng và triệt tiêu hoàn toàn va chạm hình học.   ","items":[{"src":"media/m26.webp","cap":""}],"gs":310,"al":"justify"},{"t":"project","title":"Mô phỏng technomatix","text":"\u003cb>Bài toán:\u003c/b> Đánh giá năng lực dây chuyền, dự báo điểm nghẽn và tối ưu hóa luồng logistics nội bộ trước khi đầu tư lắp đặt nhà m <script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])).replace(/&lt;(\/?)(b|i|u)&gt;/g,"<$1$2>");
const KEY="eportfolio3-draft";let baked=$("#data").textContent;
const hash=s=>{let h=5381;for(let i=0;i<s.length;i++)h=((h*33)^s.charCodeAt(i))>>>0;return h};
const BASE=hash(baked.length+"|"+baked.slice(0,4000)+baked.slice(-4000));
let D;try{const d=JSON.parse(localStorage.getItem(KEY)||"null");D=(d&&d.base===BASE)?d.data:JSON.parse(baked)}catch(e){D=JSON.parse(baked)}
baked="";$("#data").textContent="";
function migrate(){D.pages.forEach(p=>p.blocks.forEach(b=>{if(b.t==='media'&&!b.items){b.items=b.src?[{src:b.src}]:[];delete b.src}}))}
migrate();
const PUB=document.documentElement.dataset.pub==="1";
let EDIT=!PUB&&new URLSearchParams(location.search).has("edit"),warned=false,reveal,mv=null,rz=null,tm;
const r1=n=>Math.round(n*10)/10,clamp=(a,b,v)=>Math.max(a,Math.min(b,v));
const ED=p=>EDIT?` contenteditable="true" data-p="${p}"`:"";
const slug=s=>s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[đĐ]/g,"d").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
const blocksOf=i=>D.pages[+i].blocks;
const MEDIA=new Map();
function dataToBlob(d){const i=d.indexOf(","),mt=d.slice(5,d.indexOf(";")),bin=atob(d.slice(i+1)),u=new Uint8Array(bin.length);for(let k=0;k<bin.length;k++)u[k]=bin.charCodeAt(k);return new Blob([u],{type:mt})}
function conv(v){
  if(typeof v==="string"){if(v.length>30000&&v.startsWith("data:")){const b=dataToBlob(v),u=URL.createObjectURL(b);MEDIA.set(u,b);return u}return v}
  if(Array.isArray(v)){for(let i=0;i<v.length;i++)v[i]=conv(v[i])}
  else if(v&&typeof v==="object"){for(const k in v)v[k]=conv(v[k])}
  return v;
}
let dirty=false;
addEventListener("beforeunload",e=>{if(dirty&&EDIT){e.preventDefault();e.returnValue=""}});

/* Cỡ chữ chung */
let FS=D.site.fs||100;
const applyFS=()=>document.documentElement.style.fontSize=FS+"%";
applyFS();

const OPTS=`<option value="h2">Tiêu đề lớn</option><option value="h3">Tiêu đề nhỏ</option><option value="p">Đoạn văn</option><option value="ul">Danh sách</option><option value="img">Hình ảnh</option><option value="media">Ảnh + đoạn văn (cạnh nhau)</option><option value="sec">Tiêu đề mục (có đường kẻ)</option><option value="slider">Ảnh chạy tự động (khổ rộng)</option><option value="gallery">Bộ sưu tập ảnh</option><option value="project">Dự án (văn bản + ảnh lướt)</option><option value="contact">Thông tin liên hệ + bản đồ</option><option value="cv">Chỗ tải CV</option><option value="btn">Nút bấm</option>`;
const DEF={sec:{text:"TIÊU ĐỀ MỤC"},slider:{items:[]},h2:{text:"Tiêu đề mới"},h3:{text:"Tiêu đề nhỏ"},p:{text:"Đoạn văn mới. Bấm vào để sửa."},ul:{items:["Mục 1","Mục 2"]},img:{cap:"Chú thích ảnh"},media:{items:[],title:"TIÊU ĐỀ",text:"Đoạn mô tả. Bấm vào để sửa."},gallery:{items:[]},project:{title:"Tên dự án",text:"Mô tả ngắn về dự án.",items:[]},contact:{items:[["Email:","email@example.com"]],map:""},cv:{},btn:{text:"Nút mới",href:"#"}};
const NEW={ul:()=>"Mục mới",contact:()=>["Nhãn:","Giá trị"],profile:()=>"Thông tin mới"};
const lnk=v=>/@/.test(v)?"mailto:"+v:/^(https?:\/\/|www\.)/.test(v)?(v.startsWith("http")?v:"https://"+v):null;
const mail=x=>esc(x).replace(/([\w.+-]+@[\w-]+\.[\w.]+)/g,'<a href="mailto:$1">$1</a>');
const pic=(src,pk,alt="")=>src?`<img src="${esc(src)}" alt="${esc(alt)}" loading="lazy" decoding="async"${pk}>`:`<div class="ph"${pk}>${EDIT?"Bấm để chọn ảnh":"Ảnh đang cập nhật"}</div>`;
const BU={};
function blobURL(d){const k=d.length+d.slice(-40);if(BU[k])return BU[k];const [h,b]=d.split(","),bin=atob(b),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return BU[k]=URL.createObjectURL(new Blob([u],{type:h.match(/:(.*?);/)[1]}))}
const xbtn=k=>EDIT?`<button type="button" class="x" data-act="imgdel" data-k="${k}" title="Xóa ảnh">✕</button>`:"";

function slideHTML(b,pk){return b.items.length?`<div class="track">${b.items.map((it,k)=>`<div class="slide">${pic(it.src,pk(`items.${k}.src`))}${xbtn(k)}</div>`).join("")}</div>${b.items.length>1?`<button type="button" class="sa l" data-sl="-1" aria-label="Ảnh trước">‹</button><button type="button" class="sa r" data-sl="1" aria-label="Ảnh sau">›</button>`:""}`:`<div class="ph">${EDIT?"Chưa có ảnh. Hãy bấm nút Thêm ảnh ở thanh phía trên.":"Hình ảnh đang cập nhật"}</div>`}
function block(b,pi,bi){
  const P=`pages.${pi}.blocks.${bi}`,E=p=>ED(`${P}.${p}`),pk=p=>EDIT?` data-pick="${P}.${p}"`:"";let h="";
  switch(b.t){
    case"h2":h=`<h2${E("text")}>${esc(b.text)}</h2>`;break;
    case"sec":h=`<h2 class="sh"${E("text")}>${esc(b.text)}</h2>`;break;
    case"slider":h=`<div class="slider wide" style="--gs:${b.gs||420}px">${slideHTML(b,pk)}</div>`;break;
    case"h3":h=`<h3${E("text")}>${esc(b.text)}</h3>`;break;
    case"p":h=`<p${E("text")}>${esc(b.text)}</p>`;break;
    case"ul":h=`<ul class="list">${b.items.map((x,k)=>`<li${E("items."+k)}>${esc(x)}</li>`).join("")}</ul>`;break;
    case"img":h=`<figure${b.w&&b.w<100?` style="width:${b.w}%"`:""}><div class="iw">${pic(b.src,pk("src"),b.cap)}${EDIT&&b.src?`<span class="rsz" data-rz="img" title="Kéo để đổi kích thước ảnh"></span>`:""}</div><figcaption${E("cap")}>${esc(b.cap)}</figcaption></figure>`;break;
    case"media":h=`<div class="media"><div class="m-img"${EDIT?" data-rzbox":""} style="width:${b.iw||320}px"><div class="slider" style="--gs:${b.gs||320}px">${slideHTML(b,pk)}</div>${EDIT?`<span class="rsz" data-rz="px" data-key="iw" title="Kéo để đổi kích thước khung ảnh"></span>`:""}</div><div class="m-t"><h3${E("title")}>${esc(b.title)}</h3><p${E("text")}>${esc(b.text)}</p></div></div>`;break;
    case"gallery":h=`<div class="gal" style="--gs:${b.gs||220}px">${b.items.length?b.items.map((it,k)=>`<figure class="gi"><div class="giw">${pic(it.src,pk(`items.${k}.src`),it.cap)}${xbtn(k)}</div>${it.cap||EDIT?`<figcaption${E(`items.${k}.cap`)}>${esc(it.cap)}</figcaption>`:""}</figure>`).join(""):(EDIT?`<div class="ph" style="grid-column:1/-1">Chưa có ảnh. Hãy bấm nút Thêm ảnh ở thanh phía trên.</div>`:"")}</div>`;break;
    case"project":h=`<div class="proj${D.pages[pi].blocks.slice(0,bi).filter(x=>x.t==="project").length%2?" alt":""}"><div class="pj-t"><h3${E("title")}>${esc(b.title)}</h3><p${E("text")}>${esc(b.text)}</p></div><div class="slider" style="--gs:${b.gs||280}px">${slideHTML(b,pk)}</div></div>`;break;
    case"profile":h=`<div class="profile"><div class="pf-top"><div class="pf-photo"${EDIT?" data-rzbox":""} style="width:${b.pw||220}px">${pic(b.photo,pk("photo"),b.name)}${EDIT?`<span class="rsz" data-rz="px" data-key="pw" title="Kéo để đổi kích thước ảnh"></span>`:""}</div><div class="pf-i"><h2${E("name")}>${esc(b.name)}</h2><ul>${b.lines.map((x,k)=>`<li${E("lines."+k)}>${EDIT?esc(x):mail(x)}</li>`).join("")}</ul></div></div><blockquote${E("quote")}>${esc(b.quote)}</blockquote><div class="pf-pill"><span${E("name")}>${esc(b.name)}</span> | <span${E("role")}>${esc(b.role)}</span></div></div>`;break;
    case"contact":h=`<div class="cgrid"><ul class="contact">${b.items.map((c,k)=>{const u=!EDIT&&lnk(c[1]);return`<li><b class="lb"${E(`items.${k}.0`)}>${esc(c[0])}</b>${u?`<a href="${esc(u)}" target="_blank" rel="noopener">${esc(c[1])}</a>`:`<span${E(`items.${k}.1`)}>${esc(c[1])}</span>`}</li>`}).join("")}</ul>${b.map?`<iframe class="map" loading="lazy" src="https://www.google.com/maps?q=${encodeURIComponent(b.map)}&output=embed" title="Bản đồ"></iframe>`:""}</div>`;break;
    case"cv":{let inner;
      if(b.data){const isb=b.data.startsWith("blob:"),isd=b.data.startsWith("data:"),mt=isb?((MEDIA.get(b.data)||{}).type||""):(isd?b.data.slice(5,b.data.indexOf(";")):""),pdf=mt==="application/pdf"||(!isb&&!isd&&/\.pdf$/i.test(b.data)),u=(isd&&pdf)?blobURL(b.data):b.data;
        inner=`${pdf?`<iframe class="cvf" src="${u}#toolbar=0&navpanes=0&view=FitH" title="CV"></iframe>`:`<img class="cvi" src="${u}" alt="CV">`}<p>${pdf?`<a class="btn" href="${u}" target="_blank" rel="noopener" style="margin-right:10px">Xem toàn màn hình</a>`:""}<a class="btn" href="${u}" download="${esc(b.name||"CV")}">Tải CV về</a></p>`}
      else inner=EDIT?`<div class="ph" data-pickcv="${P}">Bấm vào đây để tải CV của bạn lên (PDF hoặc ảnh)</div>`:`<div class="ph">CV đang được cập nhật</div>`;
      h=`<div class="cv">${inner}${EDIT&&b.data?`<p><button type="button" class="mini" data-pickcv="${P}">Đổi file CV</button></p>`:""}</div>`;break}
    case"btn":h=`<a class="btn" href="${esc(b.href)}"${EDIT?' onclick="return false"':""}><span${E("text")}>${esc(b.text)}</span></a>`;break;
  }
  const rv=`<div class="rv"${b.al?` style="text-align:${b.al}"`:""}>${h}</div>`;

  if(!EDIT)return st?`<div class="mv" style="${st}">${rv}</div>`:rv;
  const bt=(a,t)=>`<button type="button" data-act="${a}">${t}</button>`;
  let c=`<span class="grip" title="Nhấn giữ rồi kéo đến bất kỳ đâu">⠿ Kéo</span>`+bt("up","↑")+bt("down","↓")+bt("fs-","A−")+bt("fs+","A+");
  if(b.t==="gallery"||b.t==="project"||b.t==="media"||b.t==="slider")c+=bt("addimg","＋ Thêm ảnh")+bt("gs-","Ảnh −")+bt("gs+","Ảnh +");

  if(b.t==="img"&&b.w)c+=bt("fullw","↔ Cỡ gốc");
  if(b.x||b.y)c+=bt("reset","⟲ Về chỗ cũ");
  return`<div class="blk" data-pi="${pi}" data-bi="${bi}" style="${st}"><div class="ctl">${c+bt("del","✕ Xóa")}</div>${rv}</div>`;

  if(home){
    $("#hero").innerHTML=`<div class="hero"${bgs}><div class="hin"><h1 class="rv"${ED("site.heroTitle")}>${esc(S.heroTitle)}</h1><p class="rv" style="--d:150ms"${ED("site.heroSub")}>${esc(S.heroSub)}</p></div><button type="button" class="down" data-down aria-label="Cuộn xuống">⌄</button></div>`;
  }else{
    const par=L.find(x=>x.id===pg.parent);
    $("#hero").innerHTML=`<div class="phead" style="--hs:${S.hs||1}"><div class="wrap"><p class="crumb rv"><a href="#trang-chu">Trang chủ</a>${par?` / <a href="#${par.id}">${esc(par.label)}</a>`:""} / ${esc(pg.label)}</p><h1 class="rv" style="--d:100ms"${ED(`pages.${pi}.title`)}>${esc(pg.title)}</h1></div></div>`;
  }
  const sel=`<select data-addblk="${pi}" aria-label="Thêm khối"><option value="">＋ Thêm khối…</option>${OPTS}</select>`;
  const sctl=EDIT?`<div class="sctl">${home?"":`<button type="button" data-sa="up" data-pi="${pi}">← Đưa lên trước</button><button type="button" data-sa="down" data-pi="${pi}">Đưa ra sau →</button><button type="button" data-sa="ren" data-pi="${pi}">Đổi tên menu</button><button type="button" data-sa="del" data-pi="${pi}">Xóa trang</button>`}${sel}</div>`:"";
  $("#secs").innerHTML=`<section class="sec"><div class="wrap">${sctl}${pg.blocks.map((x,bi)=>block(x,pi,bi)).join("")}</div></section>`;
  $("#foot").textContent=`© ${new Date().getFullYear()} ${S.name}`;
  document.title=(home?S.name:pg.label+" – "+S.name);
  reveal&&reveal.disconnect();
  reveal=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");reveal.unobserve(e.target)}}),{threshold:.1,rootMargin:"0px 0px -5% 0px"});

  startSlides();
  if(keep)scrollTo({top:y,left:0,behavior:"instant"});
}

/* Gõ chữ trực tiếp */
function serialize(el){
  let out="";
  (function walk(n,st){
    for(const c of n.childNodes){
      if(c.nodeType===3){
        const t=c.nodeValue.replace(/\u00a0/g," ");if(!t)continue;
        out+=(st.b?"<b>":"")+(st.i?"<i>":"")+(st.u?"<u>":"")+t+(st.u?"</u>":"")+(st.i?"</i>":"")+(st.b?"</b>":"");
      }else if(c.nodeType===1){
        const tg=c.tagName;
        if(tg==="BR"){out+="\n";continue}
        const ns={...st},fw=c.style&&c.style.fontWeight;
        if(tg==="B"||tg==="STRONG"||/^(bold|[6-9]00)$/.test(fw))ns.b=1;
        if(tg==="I"||tg==="EM"||(c.style&&c.style.fontStyle==="italic"))ns.i=1;
        if(tg==="U")ns.u=1;
        if(tg==="DIV"||tg==="P"){if(out&&!out.endsWith("\n"))out+="\n"}
        walk(c,ns);
      }
    }
  })(el,{});
  if(el.lastChild&&el.lastChild.nodeName==="BR")out=out.replace(/\n$/,"");
  return out;
}

/* Chọn ảnh/GIF/PDF. GIF và PDF giữ nguyên bản gốc để ảnh động không bị mất */
const readRaw=f=>new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(f)});
async function readImg(f,max=1280){
  if(f.type==="image/gif"&&f.size>4e6&&!confirm(`File GIF "${f.name}" nặng ${(f.size/1e6).toFixed(1)} MB. GIF nặng làm trang mở chậm và dễ bị đơ.\nBạn vẫn muốn dùng file này?\n(Gợi ý: nén hoặc đổi sang WebP động, rộng khoảng 720 px, trước khi thêm vào.)`))return null;
  if(/gif|svg|pdf|webp/.test(f.type))return readRaw(f);
  const src=await readRaw(f);
  return new Promise(r=>{const im=new Image();im.onload=()=>{const s=Math.min(1,max/im.width),c=document.createElement("canvas");c.width=im.width*s;c.height=im.height*s;const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);r(c.toDataURL("image/jpeg",.82))};im.onerror=()=>r(src);im.src=src});
}
function pickFiles(cb,o={},done){const f=$("#file");f.accept=o.accept||"image/*";f.multiple=!!o.multi;f.value="";f.onchange=async()=>{for(const x of [...f.files]){const u=await readImg(x,o.max);if(u)cb(u,x)}done&&done()};f.click()}

      case"imgdel":x.items.splice(+ab.dataset.k,1);break;

  const sb=T.closest("[data-sa]");

      case"down":if(j<sibs.length-1){const o=sibs[j+1];[D.pages[o],D.pages[pi]]=[D.pages[pi],D.pages[o]]}break;
      case"ren":{const v=prompt("Tên hiện trên menu:",p.label);if(!v||!v.trim())return;p.label=v.trim();break}

    }

  const t=T.closest("#tb [data-t]");if(!t)return;

    case"bg":pickFiles(u=>D.site.bg=u,{max:1920},()=>{save();render(true)});break;
    case"unbg":delete D.site.bg;save();render(true);break;
    case"hs-":case"hs+":D.site.hs=r1(clamp(.5,2,(D.site.hs||1)+(t.dataset.t==="hs+"?.1:-.1)));save();render(true);break;
    case"reset":if(confirm("Bỏ toàn bộ thay đổi chưa lưu và quay về bản gốc của file này?")){localStorage.removeItem(KEY);dirty=false;location.reload()}break;
    case"exit":EDIT=false;render(true);break;
    case"dl":download();break;

    case"import":{const f=$("#file");f.accept=".html,text/html";f.multiple=false;f.value="";
      f.onchange=async()=>{const x=f.files[0];if(!x)return;
        const fin=busy("Đang nhập nội dung, vui lòng chờ…");
        try{const txt=await x.text(),a=txt.indexOf('id="data">');if(a<0)throw 0;
          const st=txt.indexOf(">",a)+1,en=txt.indexOf("</scr"+"ipt>",st),nd=JSON.parse(txt.slice(st,en));

          alert("Đã nhập xong nội dung. Hãy bấm \"Lưu và tải file\" để lưu thành file mới.");
        }catch(err){alert("Không đọc được nội dung từ file này. Hãy chọn file index.html đã tải từ trang của bạn.")}fin()};
      f.click();break}

});
function newPage(label,parent){

  let id=slug(label)||"trang",n=2,b=id;while(D.pages.some(p=>p.id===id))id=b+"-"+n++;
  const p={id,label,title:label,blocks:[{t:"p",text:"Nội dung mới. Bấm vào chữ để sửa."}]};if(parent)p.parent=parent;
  D.pages.push(p);save();location.hash=id;
}

const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return b=>{let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=t[(c^b[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0}})();
function zipBlob(files){
  const enc=new TextEncoder(),parts=[],cd=[];let off=0;
  for(const f of files){
    const nm=enc.encode(f.name),crc=CRC(f.data),sz=f.data.length;
    const h=new DataView(new ArrayBuffer(30));
    h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(12,0x21,true);
    h.setUint32(14,crc,true);h.setUint32(18,sz,true);h.setUint32(22,sz,true);h.setUint16(26,nm.length,true);
    parts.push(h.buffer,nm,f.data);
    const c=new DataView(new ArrayBuffer(46));
    c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint16(14,0x21,true);
    c.setUint32(16,crc,true);c.setUint32(20,sz,true);c.setUint32(24,sz,true);c.setUint16(28,nm.length,true);c.setUint32(42,off,true);
    cd.push(c.buffer,nm);off+=30+nm.length+sz;
  }
  let cs=0;for(const x of cd)cs+=x.byteLength;
  const e=new DataView(new ArrayBuffer(22));
  e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cs,true);e.setUint32(16,off,true);
  return new Blob([...parts,...cd,e.buffer],{type:"application/zip"});
}
async function exportSite(){
  const fin=busy("Đang tạo thư mục nhẹ, vui lòng chờ…");
  try{
    const files=[],names=new Map(),ext={"image/jpeg":"jpg","image/png":"png","image/webp":"webp","image/gif":"gif","image/svg+xml":"svg","application/pdf":"pdf"};
    const mp=async v=>{
      if(typeof v==="string"){const bl=v.startsWith("blob:")&&MEDIA.get(v);if(!bl)return v;
        if(!names.has(v)){const nm="media/"+(bl.type==="application/pdf"?"cv-":"m")+names.size+"."+(ext[bl.type]||"bin");names.set(v,nm);files.push({name:nm,data:new Uint8Array(await bl.arrayBuffer())})}
        return names.get(v)}
      if(Array.isArray(v)){const o=[];for(const x of v)o.push(await mp(x));return o}
      if(v&&typeof v==="object"){const o={};for(const k in v)o[k]=await mp(v[k]);return o}
      return v;
    };
    const data=await mp(D);
    const c=document.documentElement.cloneNode(true);
    c.querySelector("#data").textContent="@@DATA@@";
    ["#nav","#hero","#secs","#foot"].forEach(q=>c.querySelector(q).innerHTML="");
    c.querySelector("body").className="";c.removeAttribute("data-theme");c.removeAttribute("style");c.querySelector("#pg").removeAttribute("style");
    c.setAttribute("data-pub","1");
    const html="<!DOCTYPE html>\n"+c.outerHTML,i=html.indexOf("@@DATA@@");
    files.unshift({name:"index.html",data:new TextEncoder().encode(html.slice(0,i)+"\n"+JSON.stringify(data).replace(/</g,"\\u003c")+"\n"+html.slice(i+8))});
    const a=document.createElement("a");a.href=URL.createObjectURL(zipBlob(files));a.download="trang-web.zip";document.body.appendChild(a);a.click();a.remove();
  }catch(err){alert("Không tạo được thư mục để đưa lên mạng. Hãy thử lại hoặc nén bớt ảnh nặng.")}
  fin();
}
async function download(){
  const fin=busy("Đang chuẩn bị file, vui lòng chờ…"),IC=new Map();
  try{
    const inl=async v=>{
      if(typeof v==="string"){const bl=v.startsWith("blob:")&&MEDIA.get(v);if(!bl)return v;if(!IC.has(v))IC.set(v,await readRaw(bl));return IC.get(v)}
      if(Array.isArray(v)){const o=[];for(const x of v)o.push(await inl(x));return o}
      if(v&&typeof v==="object"){const o={};for(const k in v)o[k]=await inl(v[k]);return o}
      return v;
    };
    const data=await inl(D);
    const c=document.documentElement.cloneNode(true);
    c.querySelector("#data").textContent="@@DATA@@";
    ["#nav","#hero","#secs","#foot"].forEach(q=>c.querySelector(q).innerHTML="");
    c.querySelector("body").className="";c.removeAttribute("data-theme");c.removeAttribute("style");c.querySelector("#pg").removeAttribute("style");
    const html="<!DOCTYPE html>\n"+c.outerHTML,i=html.indexOf("@@DATA@@");
    const blob=new Blob([html.slice(0,i),"\n",JSON.stringify(data).replace(/</g,"\\u003c"),"\n",html.slice(i+8)],{type:"text/html"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="index.html";document.body.appendChild(a);a.click();a.remove();
    dirty=false;
  }catch(err){alert("Không tạo được file. Có thể trình duyệt thiếu bộ nhớ vì ảnh/GIF quá nặng. Hãy nén bớt ảnh/GIF rồi thử lại.")}
  fin();
}
